name: Transfer signing configuration to GitHub

on:
  workflow_dispatch:

jobs:
  transfer:
    if: github.server_url == 'https://git.ryserve.net' && github.repository == 'public/galaxy' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      code: read
    steps:
      - name: Prepare sealed-box encryption without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          library="$RUNNER_TEMP/galaxy-seal-$GITHUB_RUN_ID"
          mkdir "$library"
          python3 -m pip install --disable-pip-version-check --no-input --quiet --target "$library" PyNaCl==1.6.2
          echo "GALAXY_SEAL_LIBRARY=$library" >> "$GITHUB_ENV"

      - name: Encrypt existing Apple configuration for the GitHub repository
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          PYTHONPATH="$GALAXY_SEAL_LIBRARY" python3 - <<'PY'
          import base64, json, os, sys
          from nacl.public import PublicKey, SealedBox
          names = ('APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD',
                   'APPLE_SIGNING_IDENTITY', 'APPLE_TEAM_ID', 'APPLE_API_KEY',
                   'APPLE_API_ISSUER', 'APPLE_API_KEY_P8')
          try:
              box = SealedBox(PublicKey(base64.b64decode('7jfcaZiqkhEdDGiV4bLWjF98WLhg6UltCrdVeEhbPBA=', validate=True)))
              values = []
              for name in names:
                  value = os.environ.get(name, '').encode('utf-8')
                  if not value or len(value) > 48 * 1024:
                      raise ValueError('Invalid credential size')
                  values.append({'name': name, 'encrypted_value': base64.b64encode(box.encrypt(value)).decode('ascii')})
              # Ciphertexts are sealed for GitHub; no plaintext or GitHub token
              # leaves this step. The operator submits these through GitHub API.
              print('GALAXY_SEALED_TRANSFER_JSON:' + json.dumps({'key_id': '3380204578043523366', 'secrets': values}, separators=(',', ':')))
          except Exception:
              print('Signing configuration encryption failed; details withheld.', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Remove temporary encryption dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          rm -rf -- "$RUNNER_TEMP/galaxy-seal-$GITHUB_RUN_ID"
