name: macOS beta

on:
  push:
    branches: [master]

jobs:
  macos-beta:
    # The same single-capacity native runner as releases. Keep each master build;
    # never cancel a signing/notarization job to replace it with a newer push.
    runs-on: macos-arm64
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.after != '0000000000000000000000000000000000000000'
    timeout-minutes: 300
    permissions:
      code: read
      actions: read
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      GALAXY_BUILD_CHANNEL: beta
      GALAXY_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the triggering master commit
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.17.0'

      - name: Validate the master beta source
        id: beta
        shell: bash
        run: node script/ci/check-beta-build.mjs

      - name: Set up pinned build tools
        shell: bash
        run: bash script/ci/setup-macos.sh

      - name: Build Galaxy without signing credentials
        shell: bash
        run: |
          export PATH="$GALAXY_TOOLS_DIR/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          bash script/ci/build-macos.sh

      - name: Sign, notarize, staple, and create beta DMG
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash script/ci/package-macos.sh

      - name: Upload verified beta DMG and checksums
        uses: https://gitea.com/actions/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: Galaxy-beta-${{ steps.beta.outputs.sha }}-${{ github.run_attempt }}-macos-arm64
          path: ${{ env.GALAXY_RELEASE_DIR }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove job build files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Signing restores the runner keychains in package-macos.sh's trap.
          for kind in build artifacts tools; do
            [[ "$RUNNER_TEMP" == /* && "$GALAXY_JOB_ID" =~ ^[0-9]+-[0-9]*$ ]]
            rm -rf -- "$RUNNER_TEMP/galaxy-$kind-$GALAXY_JOB_ID"
          done
