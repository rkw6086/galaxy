name: Release checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      code: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.17.0'
      - name: Validate release metadata and scripts
        shell: bash
        run: |
          set -euo pipefail
          node script/release.mjs check
          node --check script/ci/check-release-tag.mjs
          node --check script/ci/check-beta-build.mjs
          node --check script/ci/check-github-build.mjs
          bash -n script/ci/setup-macos.sh script/ci/build-macos.sh script/ci/package-macos.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('script/ci/publish-release.py').read_text())
          ast.parse(Path('script/ci/sync-repositories.py').read_text())
          ast.parse(Path('script/ci/publish-github-release.py').read_text())
          PY
