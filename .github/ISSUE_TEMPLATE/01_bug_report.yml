name: Bug Report
description: "Report a problem with Galaxy. For SSH connection or remote shell integration problems, use the SSH report."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Reports are public. Remove credentials, tokens, personal information, and private project content from any screenshots or logs."
  - type: checkboxes
    attributes:
      label: "Pre-submit checks"
      options:
        - label: "I have [searched Galaxy issues](https://github.com/rkw6086/galaxy/issues?q=is%3Aissue) and found no duplicate report."
          required: true
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what happens."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "Steps to reproduce"
      description: "Include the commands, settings, and actions needed to reproduce the problem."
      placeholder: "1. Open ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If available, attach relevant screenshots or redacted logs, including the exact error and time it occurred."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system version"
      description: "For example: macOS 15.6, Ubuntu 24.04, or Windows 11 24H2."
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Shell and version"
      description: "For example: zsh 5.9, bash 5.2, or PowerShell 7.5."
    validations:
      required: false
  - type: input
    id: "galaxy-version"
    attributes:
      label: "Galaxy version and build"
      description: "Open Settings > About and include the version and build details shown there. For a source build, include the commit if known."
    validations:
      required: true
  - type: dropdown
    id: "regression"
    attributes:
      label: "Did this work in an earlier Galaxy version?"
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: "galaxy-version-regression-date"
    attributes:
      label: "Last working Galaxy version or date"
      description: "If this used to work, include the most recent version or date when it worked."
    validations:
      required: false
  - type: textarea
    id: "ai-context"
    attributes:
      label: "AI provider details, if applicable"
      description: "For agent or model issues, include the provider, model ID, connection type (direct provider or ACP), and the failed action or error. Attach relevant redacted AI Activity details if available."
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other relevant details. On Linux, include whether you use X11 or Wayland. For graphics issues, include your GPU and driver version."
    validations:
      required: false
  - type: dropdown
    id: "blocker"
    attributes:
      label: "Does this block you from using Galaxy daily?"
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Does this happen in other terminals?"
      description: "For terminal or shell issues, comparison with another terminal can help identify the cause."
      options:
        - "Only in Galaxy"
        - "Also in other terminals"
        - "Not tested"
        - "Not applicable"
    validations:
      required: true
