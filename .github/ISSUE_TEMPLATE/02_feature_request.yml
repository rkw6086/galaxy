name: Feature Request
description: "Suggest an improvement to Galaxy. Search existing requests before opening a new one."
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit checks"
      options:
        - label: "I have [searched Galaxy feature requests](https://github.com/rkw6086/galaxy/issues?q=is%3Aissue+label%3Aenhancement) and found no duplicate request."
          required: true
        - label: "I have reviewed [Galaxy's project guide](https://github.com/rkw6086/galaxy/blob/master/README.md) and the feature is not already available."
          required: true
  - type: textarea
    id: "describe-solution"
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: "related-to-problem"
    attributes:
      label: "What problem would this solve?"
      description: "Describe the task or workflow that is difficult today."
      placeholder: "When I ..., I need to ..."
    validations:
      required: false
  - type: textarea
    id: "alternatives"
    attributes:
      label: "Alternatives considered"
      description: "Describe any workarounds or other approaches you've tried."
    validations:
      required: false
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other context or screenshots. Remove private information before attaching files."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      options:
        - macOS
        - Linux
        - Windows
        - Cross-platform
    validations:
      required: true
  - type: dropdown
    id: "importance"
    attributes:
      label: "How important is this feature to you?"
      options:
        - "1 (Not too important)"
        - "2"
        - "3"
        - "4"
        - "5 (Can't work without it!)"
    validations:
      required: true
