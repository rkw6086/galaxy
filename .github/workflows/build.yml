name: Build Galaxy

on:
  pull_request:
    branches: [master]
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  schedule:
    - cron: '0 4 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nightly and stable publication share one queue; PR builds have their own.
  group: galaxy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publication' }}
  queue: max
  cancel-in-progress: false

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  GALAXY_JOB_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  GALAXY_GITHUB_CI: '1'

jobs:
  prepare-publication:
    if: >-
      github.repository == 'rkw6086/galaxy' &&
      (((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Authenticated draft-release discovery requires a push-capable token.
      contents: write
      actions: read
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      nightly_id: ${{ steps.prepare.outputs.nightly_id }}
      artifact_identity: ${{ steps.prepare.outputs.artifact_identity }}
      release_timestamp: ${{ steps.prepare.outputs.release_timestamp }}
      previous_nightly_sha: ${{ steps.prepare.outputs.previous_nightly_sha }}
      previous_nightly_build: ${{ steps.prepare.outputs.previous_nightly_build }}
      previous_nightly_release_id: ${{ steps.prepare.outputs.previous_nightly_release_id }}
      previous_nightly_ref: ${{ steps.prepare.outputs.previous_nightly_ref }}
      previous_nightly_pending: ${{ steps.prepare.outputs.previous_nightly_pending }}
    steps:
      - name: Check out source and immutable tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Validate source, channel, and changes since the previous Nightly
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/ci/check-github-build.mjs
      - name: Retain bounded release notes for publication
        if: steps.prepare.outputs.build == 'true' && steps.prepare.outputs.channel != 'ci'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-release-notes
          path: ${{ steps.prepare.outputs.notes_file }}
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  prepare-pr:
    if: github.repository == 'rkw6086/galaxy' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.prepare.outputs.build }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      artifact_identity: ${{ steps.prepare.outputs.artifact_identity }}
      release_timestamp: ${{ steps.prepare.outputs.release_timestamp }}
    steps:
      - name: Check out the pull request and immutable tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Validate the unsigned pull request build
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/ci/check-github-build.mjs

  prepare:
    needs: [prepare-publication, prepare-pr]
    if: >-
      ${{ !cancelled() && github.repository == 'rkw6086/galaxy' &&
          ((github.event_name == 'pull_request' && needs['prepare-pr'].result == 'success') ||
           (github.event_name != 'pull_request' && needs['prepare-publication'].result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      build: ${{ needs['prepare-publication'].outputs.build || needs['prepare-pr'].outputs.build }}
      channel: ${{ needs['prepare-publication'].outputs.channel || needs['prepare-pr'].outputs.channel }}
      version: ${{ needs['prepare-publication'].outputs.version || needs['prepare-pr'].outputs.version }}
      sha: ${{ needs['prepare-publication'].outputs.sha || needs['prepare-pr'].outputs.sha }}
      nightly_id: ${{ needs['prepare-publication'].outputs.nightly_id }}
      artifact_identity: ${{ needs['prepare-publication'].outputs.artifact_identity || needs['prepare-pr'].outputs.artifact_identity }}
      release_timestamp: ${{ needs['prepare-publication'].outputs.release_timestamp }}
      previous_nightly_sha: ${{ needs['prepare-publication'].outputs.previous_nightly_sha }}
      previous_nightly_build: ${{ needs['prepare-publication'].outputs.previous_nightly_build }}
      previous_nightly_release_id: ${{ needs['prepare-publication'].outputs.previous_nightly_release_id }}
      previous_nightly_ref: ${{ needs['prepare-publication'].outputs.previous_nightly_ref }}
      previous_nightly_pending: ${{ needs['prepare-publication'].outputs.previous_nightly_pending }}
    steps:
      - name: Forward the successful preparation without checking out source
        run: echo 'Validated build inputs are ready.'

  macos:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' }}
    runs-on: macos-15
    timeout-minutes: 350
    env:
      GALAXY_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GALAXY_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GALAXY_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GALAXY_NIGHTLY_ID: ${{ needs.prepare.outputs.nightly_id }}
      GALAXY_ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
      GALAXY_RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Restore unsigned build caches
        id: build_cache
        uses: ./.github/actions/build-cache
      - name: Stage the tag-selected version or configure unsigned validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GALAXY_BUILD_CHANNEL" == release ]]; then
            node script/release.mjs stage "$GALAXY_RELEASE_VERSION" "$GALAXY_RELEASE_SHA"
            echo 'GALAXY_VERSION_STAGED=1' >> "$GITHUB_ENV"
          elif [[ "$GALAXY_BUILD_CHANNEL" == ci ]]; then
            echo 'GALAXY_UNSIGNED_PREFLIGHT=1' >> "$GITHUB_ENV"
            echo 'GALAXY_BUILD_CHANNEL=release' >> "$GITHUB_ENV"
          fi
      - name: Set up pinned native build tools
        run: bash script/ci/setup-macos.sh
      - name: Build the complete app without signing credentials
        run: bash script/ci/build-macos.sh
      - name: Flush compiler cache and show reuse statistics
        id: finish_cache
        continue-on-error: true
        run: node script/ci/cache-paths.mjs finish
      - name: Retain unsigned cache for future trusted builds
        if: >-
          ${{ success() && steps.finish_cache.outcome == 'success' &&
              steps.build_cache.outputs.cache-hit != 'true' &&
              github.repository == 'rkw6086/galaxy' && github.ref == 'refs/heads/master' &&
              (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build_cache.outputs.paths }}
          key: ${{ steps.build_cache.outputs.key }}
      - name: Sign and notarize the Apple Silicon DMG
        if: github.event_name != 'pull_request' && needs.prepare.outputs.channel != 'ci'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash script/ci/package-macos.sh
      - name: Transfer verified macOS downloads to publication
        if: github.event_name != 'pull_request' && needs.prepare.outputs.channel != 'ci'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-macos
          path: |
            ${{ env.GALAXY_RELEASE_DIR }}/*.dmg
            ${{ env.GALAXY_RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0
      - name: Remove job build files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_TEMP" == /* && "$GALAXY_JOB_ID" =~ ^[0-9]+-[0-9]+$ ]]
          for kind in build artifacts tools; do
            rm -rf -- "$RUNNER_TEMP/galaxy-$kind-$GALAXY_JOB_ID"
          done
          if [[ -n "${GALAXY_BUILD_CACHE_ROOT:-}" ]]; then
            [[ "$GALAXY_BUILD_CACHE_ROOT" == "$RUNNER_TEMP/galaxy-ci-cache-v1" && "$CARGO_TARGET_DIR" == "$RUNNER_TEMP/galaxy-build" ]]
            rm -rf -- "$CARGO_TARGET_DIR"
          fi

  linux:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GALAXY_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GALAXY_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GALAXY_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GALAXY_NIGHTLY_ID: ${{ needs.prepare.outputs.nightly_id }}
      GALAXY_ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
      GALAXY_RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Restore unsigned build caches
        id: build_cache
        uses: ./.github/actions/build-cache
      - name: Stage the tag-selected version
        if: needs.prepare.outputs.channel == 'release'
        run: |
          node script/release.mjs stage "$GALAXY_RELEASE_VERSION" "$GALAXY_RELEASE_SHA"
          echo 'GALAXY_VERSION_STAGED=1' >> "$GITHUB_ENV"
      - name: Set up pinned native build tools
        run: bash script/ci/setup-linux.sh
      - name: Build and verify Linux packages
        run: bash script/ci/build-linux.sh
      - name: Flush compiler cache and show reuse statistics
        id: finish_cache
        continue-on-error: true
        run: node script/ci/cache-paths.mjs finish
      - name: Retain unsigned cache for future trusted builds
        if: >-
          ${{ success() && steps.finish_cache.outcome == 'success' &&
              steps.build_cache.outputs.cache-hit != 'true' &&
              github.repository == 'rkw6086/galaxy' && github.ref == 'refs/heads/master' &&
              (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build_cache.outputs.paths }}
          key: ${{ steps.build_cache.outputs.key }}
      - name: Transfer verified Linux downloads to publication
        if: github.event_name != 'pull_request' && needs.prepare.outputs.channel != 'ci'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-linux
          path: |
            ${{ env.GALAXY_RELEASE_DIR }}/*.deb
            ${{ env.GALAXY_RELEASE_DIR }}/*.tar.gz
            ${{ env.GALAXY_RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  windows:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      GALAXY_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GALAXY_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GALAXY_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GALAXY_NIGHTLY_ID: ${{ needs.prepare.outputs.nightly_id }}
      GALAXY_ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
      GALAXY_RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Restore unsigned build caches
        id: build_cache
        uses: ./.github/actions/build-cache
      - name: Stage the tag-selected version
        if: needs.prepare.outputs.channel == 'release'
        run: |
          node script/release.mjs stage $env:GALAXY_RELEASE_VERSION $env:GALAXY_RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'GALAXY_VERSION_STAGED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up pinned native build tools
        run: ./script/ci/setup-windows.ps1
      - name: Build and verify the Windows installer
        run: ./script/ci/build-windows.ps1
      - name: Flush compiler cache and show reuse statistics
        id: finish_cache
        continue-on-error: true
        run: node script/ci/cache-paths.mjs finish
      - name: Retain unsigned cache for future trusted builds
        if: >-
          ${{ success() && steps.finish_cache.outcome == 'success' &&
              steps.build_cache.outputs.cache-hit != 'true' &&
              github.repository == 'rkw6086/galaxy' && github.ref == 'refs/heads/master' &&
              (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build_cache.outputs.paths }}
          key: ${{ steps.build_cache.outputs.key }}
      - name: Transfer verified Windows downloads to publication
        if: github.event_name != 'pull_request' && needs.prepare.outputs.channel != 'ci'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: galaxy-windows
          path: |
            ${{ env.GALAXY_RELEASE_DIR }}/*-setup.exe
            ${{ env.GALAXY_RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          compression-level: 0

  publish:
    needs: [prepare, macos, linux, windows]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.macos.result == 'success' &&
          needs.linux.result == 'success' && needs.windows.result == 'success' &&
          github.repository == 'rkw6086/galaxy' && github.event_name != 'pull_request' &&
          needs.prepare.outputs.build == 'true' && needs.prepare.outputs.channel != 'ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GALAXY_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GALAXY_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GALAXY_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GALAXY_NIGHTLY_ID: ${{ needs.prepare.outputs.nightly_id }}
      GALAXY_ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
      GALAXY_RELEASE_TIMESTAMP: ${{ needs.prepare.outputs.release_timestamp }}
      GALAXY_PREVIOUS_NIGHTLY_SHA: ${{ needs.prepare.outputs.previous_nightly_sha }}
      GALAXY_PREVIOUS_NIGHTLY_BUILD: ${{ needs.prepare.outputs.previous_nightly_build }}
      GALAXY_PREVIOUS_NIGHTLY_RELEASE_ID: ${{ needs.prepare.outputs.previous_nightly_release_id }}
      GALAXY_PREVIOUS_NIGHTLY_REF: ${{ needs.prepare.outputs.previous_nightly_ref }}
      GALAXY_PREVIOUS_NIGHTLY_PENDING: ${{ needs.prepare.outputs.previous_nightly_pending }}
    steps:
      - name: Set job-owned publication directories
        shell: bash
        run: |
          set -euo pipefail
          echo "GALAXY_RELEASE_DIR=$RUNNER_TEMP/galaxy-publication" >> "$GITHUB_ENV"
          echo "GALAXY_RELEASE_NOTES_FILE=$RUNNER_TEMP/galaxy-publication-notes/release-notes.md" >> "$GITHUB_ENV"
      - name: Check out the validated publication implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Collect verified macOS packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-macos
          path: ${{ env.GALAXY_RELEASE_DIR }}/macos
      - name: Collect verified Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-linux
          path: ${{ env.GALAXY_RELEASE_DIR }}/linux
      - name: Collect verified Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-windows
          path: ${{ env.GALAXY_RELEASE_DIR }}/windows
      - name: Collect release notes separately from binary payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: galaxy-release-notes
          path: ${{ runner.temp }}/galaxy-publication-notes
      - name: Publish verified downloads and update only rolling Nightly assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GALAXY_UPDATE_SIGNING_KEY: ${{ secrets.GALAXY_UPDATE_SIGNING_KEY }}
        run: python3 script/ci/publish-github-release.py
      - name: Remove this run's temporary package transfers
        # Retention remains bounded to one day if cleanup is unavailable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "galaxy-macos" or .name == "galaxy-linux" or .name == "galaxy-windows" or .name == "galaxy-release-notes") | .id' > "$RUNNER_TEMP/galaxy-owned-artifacts.txt"
          while IFS= read -r artifact; do
            [[ "$artifact" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          done < "$RUNNER_TEMP/galaxy-owned-artifacts.txt"
