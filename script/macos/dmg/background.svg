<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500">
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#0c1328"/><stop offset="1" stop-color="#17132e"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#8057d6" stop-opacity=".22"/><stop offset="1" stop-color="#8057d6" stop-opacity="0"/></radialGradient>
    <linearGradient id="arrow"><stop stop-color="#9dddf9"/><stop offset="1" stop-color="#c6b4ff"/></linearGradient>
    <linearGradient id="rim" x2="0" y2="1"><stop stop-color="#b8b5fa" stop-opacity=".2"/><stop offset="1" stop-color="#b8b5fa" stop-opacity=".04"/></linearGradient>
  </defs>
  <path fill="url(#sky)" d="M0 0h700v500H0z"/>
  <ellipse cx="565" cy="355" rx="345" ry="300" fill="url(#nebula)"/>
  <g fill="none" stroke="#b9adfa" stroke-opacity=".07">
    <ellipse cx="350" cy="290" rx="410" ry="183" transform="rotate(-24 350 290)"/>
    <ellipse cx="350" cy="290" rx="450" ry="220" transform="rotate(-24 350 290)"/>
  </g>
  <g fill="#d7dafa">
    <circle cx="60" cy="65" r="1" opacity=".35"/><circle cx="640" cy="87" r="1" opacity=".4"/>
    <circle cx="600" cy="154" r=".8" opacity=".3"/><circle cx="90" cy="393" r=".9" opacity=".3"/>
    <circle cx="626" cy="406" r="1.2" opacity=".35"/><circle cx="540" cy="455" r=".7" opacity=".4"/>
  </g>
  <!-- Reuse the exact macOS app artwork, without a duplicate raster source. -->
  <image href="../../../app/assets/bundled/png/galaxy.png" x="248" y="44" width="64" height="64"/>
  <text x="312" y="88" fill="#f3f2ff" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="600" letter-spacing="-.9">Galaxy</text>
  <text x="350" y="143" text-anchor="middle" fill="#b9bfd8" font-family="DejaVu Sans, sans-serif" font-size="15">Drag Galaxy to Applications to install</text>
  <g fill="#fff" fill-opacity=".025" stroke="url(#rim)">
    <rect x="88" y="168" width="164" height="184" rx="35"/>
    <rect x="448" y="168" width="164" height="184" rx="35"/>
  </g>
  <!-- Finder owns the real captions and exposes no text-color setting. -->
  <g fill="#dfe3f1">
    <rect x="106" y="310" width="128" height="30" rx="10"/>
    <rect x="466" y="310" width="128" height="30" rx="10"/>
  </g>
  <g fill="none" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 250h88m-15-15 15 15-15 15"/>
  </g>
  <text x="350" y="407" text-anchor="middle" fill="#9098b9" font-family="DejaVu Sans, sans-serif" font-size="12">Then open Galaxy from Applications.</text>
  <path d="M325 442h50" stroke="#b1a1ef" stroke-opacity=".25"/>
</svg>
